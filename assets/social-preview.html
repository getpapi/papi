<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Light-first canon (AD-105). Lavender ground, one purple accent. */
  :root { --bg: #f7f6fc; --ink: #15112a; --muted: #5b5673; --accent: #5a4b8a; --line: #e4e0f0; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 72px; gap: 56px; }
  .copy { flex: 1 1 52%; }
  .mark { font-weight: 800; letter-spacing: 0.32em; font-size: 26px; color: var(--accent); }
  h1 { font-size: 68px; line-height: 1.02; letter-spacing: -0.03em; margin: 28px 0 22px; font-weight: 800; }
  p { font-size: 26px; line-height: 1.4; color: var(--muted); }
  .foot { margin-top: 34px; font-size: 22px; color: var(--accent); font-weight: 600; }
  .shot { flex: 0 0 46%; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
          box-shadow: 0 24px 60px rgba(40, 28, 80, 0.16); background: #fff; }
  .shot img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="copy">
      <div class="mark">PAPI</div>
      <h1>Vibe code as a team.</h1>
      <p>Plan, build, review and release with your AI assistant. The plan, and the reasons behind it, survive every new session.</p>
      <div class="foot">getpapi.ai &nbsp;·&nbsp; MCP &nbsp;·&nbsp; free to start</div>
    </div>
    <div class="shot"><img src="hub.png" alt=""></div>
  </div>
</body>
</html>
